name: Release MCDR Plugin

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Read plugin metadata
        id: meta
        run: |
          python - <<'EOF'
          import json, os
          with open("mcdreforged.plugin.json", "r", encoding="utf-8") as f:
              data = json.load(f)
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"id={data['id']}\n")
              out.write(f"version={data['version']}\n")
              out.write(f"name={data['name']}\n")
          EOF
        shell: bash

      - name: Sync dependencies
        run: uv sync
        shell: bash

      - name: Build MCDR package
        run: uv run python -m mcdreforged pack
        shell: bash

      - name: Locate built package
        id: pkg
        run: |
          MCDR_FILE=$(find . -maxdepth 1 -name "*.mcdr" -type f | head -n 1)
          if [ -z "$MCDR_FILE" ]; then
            echo "::error::No .mcdr file found after build"
            exit 1
          fi
          MCDR_FILE="${MCDR_FILE#./}"
          echo "path=$MCDR_FILE" >> $GITHUB_OUTPUT
          echo "name=$(basename "$MCDR_FILE")" >> $GITHUB_OUTPUT
        shell: bash

      - name: Upload MCDR asset to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            "${{ steps.pkg.outputs.path }}" \
            --repo "${{ github.repository }}" \
            --clobber
        shell: bash
